name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests (host + client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Host half (34 tests)
        run: node test/host.test.mjs
      - name: Client half (16 tests)
        run: node test/client.test.mjs

  live:
    name: Live YouTube tests (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: MCP tools against live YouTube
        run: node test/mcp.test.mjs
