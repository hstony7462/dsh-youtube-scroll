name: publish

# Publishes the package to npm via Trusted Publishing (GitHub Actions OIDC).
# No NODE_AUTH_TOKEN: npm exchanges the OIDC token for a short-lived publish token,
# and the package page must have this workflow configured as a trusted publisher:
#   Publisher: GitHub Actions
#   Organization or user: hstony7462
#   Repository: dsh-youtube-scroll
#   Workflow filename: publish.yml
#   Environment: (empty)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange (do not remove)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify tag matches package.json
        run: |
          # Manual dispatch (workflow_dispatch) runs on a branch; only tag pushes are checked.
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "manual dispatch on ${GITHUB_REF}: skipping tag/version check"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install (no deps, keeps npm state predictable)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Publish with provenance (trusted publishing)
        run: |
          npm config set registry https://registry.npmjs.org/
          npm publish --provenance --access public
